# Compose v2 — no `version:` key. Networks named so future services
# (Keycloak, OTel collector, Grafana, …) can join `patentmind-net`.
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: patentmind-qdrant
    ports:
      # Bind to loopback only — POC has no auth on Qdrant; LAN exposure unsafe.
      - "127.0.0.1:6333:6333"   # REST
      - "127.0.0.1:6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - patentmind-net
    # No container healthcheck: the official qdrant/qdrant image is distroless
    # (no bash, no curl, no wget, no /dev/tcp). Any in-container probe would
    # report `unhealthy` forever. scripts/check_docker.sh probes /healthz from
    # the host instead, which is the canonical readiness signal.
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: patentmind-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patentmind}
      POSTGRES_USER: ${POSTGRES_USER:-patentmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patentmind}
    ports:
      # Loopback only — credentials are dev defaults; not safe on LAN.
      # Host port defaults to 15432 (NOT 5432): on the delivery box host
      # port 5432 is already taken by a foreign Postgres. Override with
      # POSTGRES_HOST_PORT; keep POSTGRES_URL in .env in sync when
      # AUDIT_BACKEND=postgres.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - patentmind-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-patentmind} -d ${POSTGRES_DB:-patentmind}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: patentmind-redis
    # No auth — dev only. In prod, set --requirepass and pass REDIS_URL with password.
    # maxmemory 256mb + LRU eviction prevents a runaway test eating host RAM.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      # Loopback only — Redis is unauthenticated; LAN exposure is RCE-grade bad.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - patentmind-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  keycloak:
    # Q12 P0 — real IdP for OIDC_MODE=keycloak. Dev mode (start-dev) is fine
    # for the POC: http, embedded H2 storage. Realm `patentmind` (client
    # `patentmind-gateway` + the four demo users alice/bob/carol/audit_dave,
    # passwords demo-<user>) auto-imports from keycloak/realm-patentmind.json.
    # Host port 8081: 5432/8010/8011/8088/18080/6333/6379/15432 are taken on
    # the delivery box. Smoke: bash scripts/smoke_keycloak.sh
    image: quay.io/keycloak/keycloak:26.2
    container_name: patentmind-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASS:-admin}
      # Issuer URLs must look like the host-side URL the gateway verifies
      # (http://localhost:8081/realms/patentmind), so pin hostname to the
      # host-mapped port rather than the in-container 8080.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HOST_PORT:-8081}
      KC_HTTP_ENABLED: "true"
    ports:
      # Loopback only — dev-mode Keycloak with default admin creds is not
      # safe on a LAN.
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-8081}:8080"
    volumes:
      # No data volume on purpose: a named volume at /opt/keycloak/data/h2 is
      # created root-owned while the keycloak image runs as uid 1000 → H2
      # AccessDenied at boot. Dev-mode state is throwaway; the realm (clients,
      # users, roles) re-imports from this JSON on every container start.
      - ./keycloak/realm-patentmind.json:/opt/keycloak/data/import/realm-patentmind.json:ro
    networks:
      - patentmind-net
    # No container healthcheck: the keycloak image has no curl/wget and the
    # health endpoints live on the management port (9000) only when enabled.
    # scripts/smoke_keycloak.sh probes the discovery document from the host.
    restart: unless-stopped

  minio:
    # Q13 WORM archive target (ARCHIVE_BACKEND=s3): S3-compatible Object Lock.
    # Pin a release tag in production; latest is acceptable for the POC box.
    image: minio/minio:latest
    container_name: patentmind-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-patentmind}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-patentmind-minio}
    ports:
      # Loopback only — dev credentials. Host ports 19000/19001 chosen to
      # dodge everything already taken on the delivery box (5432/8010/8011/
      # 8088/18080/6333/6379/15432) and MinIO's own common 9000/9001.
      - "127.0.0.1:19000:9000"   # S3 API  (ARCHIVE_S3_ENDPOINT)
      - "127.0.0.1:19001:9001"   # web console
    volumes:
      - minio_data:/data
    networks:
      - patentmind-net
    healthcheck:
      # `mc` ships inside the minio/minio image; `mc ready local` is the
      # upstream-documented container healthcheck.
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  qdrant_storage:
  postgres_data:
  redis_data:
  minio_data:

networks:
  patentmind-net:
    driver: bridge
