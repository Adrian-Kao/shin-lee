[project]
name = "patentmind-poc"
version = "0.2.0"
description = "PatentMind — patent Office Action analysis POC (digiRunner gateway + Dify-style AI engine)."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
# Runtime dependencies are intentionally NOT declared here.
# `requirements.txt` (root) and `backend/requirements.txt` remain the source of truth
# until the project graduates from POC to packaged distribution.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
filterwarnings = [
    # Silence pydantic v2 deprecations bubbling up from FastAPI's transitive use.
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::PendingDeprecationWarning:pydantic.*",
    # httpx 0.27 emits a DeprecationWarning about `app=` shortcut; we use ASGITransport explicitly.
    "ignore::DeprecationWarning:httpx.*",
    # Starlette / multipart noise on Python 3.12+ stubs.
    "ignore::DeprecationWarning:starlette.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "ocr_rag_cli",
    "data",
    "frontend",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line too long; formatter already enforces
    "B008",  # FastAPI uses function-call defaults (Depends, Query, ...) by design
    "UP007", # keep `Optional[X]` style — matches pydantic v2 examples
    "UP042", # keep `class X(str, Enum)` — pydantic/json serialization relies on str-subclass behaviour
]

[tool.ruff.lint.per-file-ignores]
# `B011` (assert False) is fine in tests where it documents an unreachable
# branch. `S101` (use of assert) is not selected above, so it's dead weight
# here. The glob has to be `tests/**/*.py` — `tests/*` only matches direct
# children, missing `tests/unit/*.py` and `tests/integration/*.py`.
"tests/**/*.py" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = false
follow_imports = "silent"
exclude = [
    "^ocr_rag_cli/",
    "^frontend/",
    "^data/",
]
