<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PatentMind AI — POC</title>
  </head>
  <body>
    <script>
      // Pre-React theme application to avoid FOUC on dark-mode reload.
      // Mirrors logic in src/lib/theme.jsx — keep them in sync.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {
        /* localStorage blocked — ignore */
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
