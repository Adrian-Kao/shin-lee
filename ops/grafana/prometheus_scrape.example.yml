# Example Prometheus scrape config for PatentMind (Q19).
#
# Both services expose an in-process text exposition at /metrics
# (Content-Type: text/plain; version=0.0.4). Drop this under
# prometheus.yml `scrape_configs:` and adjust the targets to your hosts.
#
# SECURITY: /metrics is intentionally UNGATED at the app layer (a Prometheus
# job can't mint a JWT / the internal token). Restrict it at the NETWORK layer:
#   * bind the service /metrics to an internal-only interface, OR
#   * front it with a scrape-credential check in the reverse proxy (digiRunner
#     / nginx), OR
#   * put Prometheus on a private network that only it can reach.
# See the SECURITY NOTE on the gateway /metrics handler.

global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: patentmind-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8010"]
        labels:
          service: gateway

  - job_name: patentmind-ai-engine
    metrics_path: /metrics
    static_configs:
      - targets: ["ai_engine:8011"]
        labels:
          service: ai_engine
